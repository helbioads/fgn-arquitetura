backend:
  name: github
  repo: helbioads/fgn-arquitetura
  branch: main
  site_domain: fgnarquitetura.com.br

local_backend: true

media_folder: "public/images"
public_folder: "/images"

# Configure Decap CMS to use the registered Portuguese locale
locale: pt

collections:
  - name: "depoimentos"
    label: "Depoimentos"
    description: "Gerencie os depoimentos dos clientes que aparecem em carrossel na página inicial."
    delete: false
    editor:
      preview: false
    files:
      - name: "depoimentos_file"
        label: "Todos os Depoimentos"
        file: "content/testimonials.json"
        fields:
          - label: "Lista de Depoimentos"
            name: "testimonials"
            widget: "list"
            summary: "{{fields.author}} ({{fields.company}})"
            fields:
              - { label: "Autor", name: "author", widget: "string" }
              - { label: "Empresa / Construtora", name: "company", widget: "string" }
              - { label: "Depoimento", name: "quote", widget: "text" }
  - name: "projetos"
    label: "Projetos (Portfólio)"
    description: "Gerencie a lista de projetos do portfólio e suas respectivas galerias de fotos."
    delete: false
    editor:
      preview: false
    files:
      - name: "projetos_file"
        label: "Todos os Projetos"
        file: "content/projects.json"
        fields:
          - label: "Lista de Projetos"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}} ({{fields.slug}})"
            fields:
              - label: "Título do Projeto"
                name: "title"
                widget: "string"
              - label: "Slug da URL"
                name: "slug"
                widget: "string"
              - label: "Capa do Projeto"
                name: "cover"
                widget: "image"
              - label: "Galeria de Imagens"
                name: "images"
                widget: "list"
                field: { label: "Imagem", name: "image", widget: "image" }
  - name: "configuracoes"
    label: "Configurações Gerais"
    description: "Gerencie os textos do banner principal, seção Quem Somos, estatísticas, serviços, logos de clientes e links de contato."
    delete: false
    editor:
      preview: false
    files:
      - name: "settings"
        label: "Configurações Globais"
        file: "content/settings.json"
        fields:
          - label: "Informações de Contato & Redes Sociais"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Link do WhatsApp", name: "whatsapp", widget: "string" }
              - { label: "E-mail de Contato", name: "email", widget: "string" }
              - { label: "Endereço Físico", name: "address", widget: "string" }
              - { label: "Página do Facebook", name: "facebook", widget: "string" }
              - { label: "Perfil do Instagram", name: "instagram", widget: "string" }
              - { label: "Perfil do LinkedIn", name: "linkedin", widget: "string" }
          - label: "Banner Principal (Hero)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Texto Pequeno (Eyebrow)", name: "eyebrow", widget: "string" }
              - { label: "Título Principal", name: "title", widget: "string" }
          - label: "Seção Quem Somos (Sobre)"
            name: "about"
            widget: "object"
            fields:
              - { label: "Texto Pequeno (Eyebrow)", name: "eyebrow", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Subtítulo", name: "subtitle", widget: "string" }
              - { label: "Descrição Completa", name: "description", widget: "text" }
              - { label: "Foto 1 (Esquerda)", name: "image1", widget: "image" }
              - { label: "Foto 2 (Direita)", name: "image2", widget: "image" }
          - label: "Números & Estatísticas"
            name: "stats"
            widget: "list"
            summary: "{{fields.value}} - {{fields.label}}"
            fields:
              - { label: "Valor (ex: +100)", name: "value", widget: "string" }
              - { label: "Texto (ex: Empreendimentos)", name: "label", widget: "string" }
          - label: "Nossos Serviços"
            name: "services"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Nome do Serviço", name: "title", widget: "string" }
              - { label: "Ícone Unicode (ex: \\ue907)", name: "icon", widget: "string" }
          - label: "Logos dos Clientes (Parceiros)"
            name: "clients"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Nome do Cliente", name: "name", widget: "string" }
              - { label: "Imagem do Logo", name: "image", widget: "image" }

