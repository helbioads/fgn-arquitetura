<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FGN Arquitetura - Painel Administrativo</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  
  <!-- Custom beautiful styling to overwrite Decap CMS styles for a premium look -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
    
    /* Global styles override */
    body {
      font-family: 'Outfit', sans-serif !important;
      background-color: #f3f4f6 !important;
    }
    
    /* Customize the top header */
    header {
      background-color: #111827 !important; /* Dark header matching FGN */
      border-bottom: 2px solid #2563eb !important; /* Blue brand border */
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06) !important;
    }
    
    header h1, header a, header span, header button {
      color: #ffffff !important;
      font-family: 'Outfit', sans-serif !important;
    }
    
    /* Navigation buttons */
    header button[class*="AppHeaderButton"] {
      border-radius: 6px !important;
      font-weight: 500 !important;
      transition: all 0.2s ease !important;
    }
    
    header button[class*="AppHeaderButton"]:hover {
      background-color: #374151 !important;
    }
    
    header button[class*="AppHeaderButtonActive"] {
      background-color: #2563eb !important;
      color: white !important;
    }

    /* Sidebar customize */
    aside {
      background-color: #ffffff !important;
      border-right: 1px solid #e5e7eb !important;
      padding-top: 20px !important;
    }

    aside a[class*="SidebarLink"] {
      border-radius: 8px !important;
      margin: 4px 12px !important;
      padding: 10px 16px !important;
      font-weight: 500 !important;
      color: #4b5563 !important;
      transition: all 0.2s ease !important;
      border-left: 0px !important;
    }

    aside a[class*="SidebarLink"]:hover {
      background-color: #f3f4f6 !important;
      color: #111827 !important;
    }

    aside a[class*="SidebarLinkActive"] {
      background-color: #2563eb !important;
      color: #ffffff !important;
    }
    
    aside a[class*="SidebarLinkActive"]:hover {
      background-color: #1d4ed8 !important;
      color: #ffffff !important;
    }

    /* Collection List and Cards */
    div[class*="CollectionHeader"] h2 {
      font-family: 'Outfit', sans-serif !important;
      font-weight: 600 !important;
      color: #111827 !important;
    }
    
    /* Inputs, Textareas, Labels in Editor */
    label[class*="ControlLabel"] {
      font-family: 'Outfit', sans-serif !important;
      color: #374151 !important;
      font-weight: 600 !important;
      font-size: 14px !important;
      margin-bottom: 6px !important;
      text-transform: uppercase !important;
      letter-spacing: 0.05em !important;
    }
    
    input, textarea, select {
      font-family: 'Outfit', sans-serif !important;
      border-radius: 6px !important;
      border: 1px solid #d1d5db !important;
      padding: 10px 14px !important;
      transition: border-color 0.15s ease !important;
    }
    
    input:focus, textarea:focus, select:focus {
      border-color: #2563eb !important;
      outline: none !important;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1) !important;
    }

    /* Clean Card Layout for lists inside the editor (removes ugly retro gray borders/bg) */
    div[class*="ListControl"] {
      border: 1px solid #e2e8f0 !important;
      border-radius: 10px !important;
      background-color: #ffffff !important;
      padding: 24px !important;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05) !important;
      margin-bottom: 24px !important;
    }

    /* Header for list control (e.g. LISTA DE DEPOIMENTOS label) */
    span[class*="ListLabel"] {
      background-color: #1e293b !important;
      color: #ffffff !important;
      border-radius: 4px !important;
      padding: 4px 10px !important;
      font-size: 11px !important;
      font-weight: 700 !important;
      letter-spacing: 0.08em !important;
      text-transform: uppercase !important;
    }

    /* List items wrapper */
    div[class*="ListControl"] > div {
      border: none !important;
      background: none !important;
    }

    /* Style the single item box (e.g. Michelle Alves, etc.) */
    div[class*="ListItem"] {
      background-color: #ffffff !important;
      border: 1px solid #e2e8f0 !important;
      border-radius: 8px !important;
      margin-bottom: 16px !important;
      overflow: hidden !important;
      box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.02) !important;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    div[class*="ListItem"]:hover {
      border-color: #cbd5e1 !important;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02) !important;
      transform: translateY(-1px) !important;
    }

    /* Top bar of each item in the list (contains drag/drop collapse headers) */
    div[class*="ListItemTopBar"] {
      background-color: #f8fafc !important;
      border-bottom: 1px solid #f1f5f9 !important;
      padding: 12px 18px !important;
      color: #475569 !important;
      font-weight: 600 !important;
    }

    /* Drag handles and collapse arrows styling */
    div[class*="ListItemTopBar"] button {
      color: #64748b !important;
      transition: color 0.15s ease !important;
    }

    div[class*="ListItemTopBar"] button:hover {
      color: #0f172a !important;
    }

    /* Add Item Button styling */
    button[class*="AddButton"] {
      background-color: #10b981 !important; /* Premium Green */
      color: #ffffff !important;
      border-radius: 8px !important;
      padding: 10px 20px !important;
      font-family: 'Outfit', sans-serif !important;
      font-weight: 600 !important;
      border: none !important;
      box-shadow: 0 2px 4px 0 rgba(16, 185, 129, 0.2) !important;
      transition: all 0.2s ease !important;
      cursor: pointer !important;
      margin-top: 10px !important;
    }

    button[class*="AddButton"]:hover {
      background-color: #059669 !important;
      box-shadow: 0 4px 6px 0 rgba(5, 150, 105, 0.3) !important;
    }
  </style>
</head>
<body>
  <script>
    // Polyfill for crypto.randomUUID in insecure contexts (non-HTTPS / local IP addresses)
    if (!window.crypto) {
      window.crypto = {
        getRandomValues: function(arr) {
          for (let i = 0; i < arr.length; i++) {
            arr[i] = Math.floor(Math.random() * 256);
          }
          return arr;
        }
      };
    }
    if (!window.crypto.randomUUID) {
      window.crypto.randomUUID = function() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
          var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
      };
    }
    // Force local backend for Decap CMS when running locally or on local network
    const host = window.location.hostname;
    if (host === 'localhost' || host === '127.0.0.1' || host.startsWith('192.168.') || host.startsWith('10.')) {
      window.CMS_ENV = 'development';
    }
  </script>
  
  <!-- Include the Decap CMS script -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <!-- Include Portuguese Translation and Register it -->
  <script src="https://unpkg.com/netlify-cms-locales@1.39.0/dist/netlify-cms-locales.js"></script>
  <script>
    // Register PT-BR locale using NetlifyCmsLocales
    if (window.NetlifyCmsLocales && window.NetlifyCmsLocales.pt) {
      window.CMS.registerLocale('pt', window.NetlifyCmsLocales.pt);
    }
  </script>

</body>
</html>
