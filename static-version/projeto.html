<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Fotos do Projeto - FGN Arquitetura</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="projeto.css">
</head>
<body class="galleryPage">
  <!-- Header -->
  <header>
    <a href="index.html">
      <img src="images/logobranco.png" alt="FGN Arquitetura">
    </a>
    <a href="index.html#projetos">Voltar ao site</a>
  </header>

  <!-- Photo Stage -->
  <section class="galleryStage">
    <button id="stage-prev" aria-label="Imagem anterior">←</button>
    <div class="galleryImage">
      <img id="stage-img" src="" alt="Imagem do Projeto">
      <span id="stage-counter">0 / 0</span>
    </div>
    <button id="stage-next" aria-label="Próxima imagem">→</button>
  </section>

  <!-- Meta Info -->
  <section class="galleryMeta">
    <div>
      <h1 id="project-title">Carregando...</h1>
      <small id="project-slug">Carregando projeto...</small>
    </div>
  </section>

  <!-- Thumbnails -->
  <div class="thumbs" id="project-thumbs">
    <!-- Generated by JS -->
  </div>

  <script src="projeto.js"></script>
</body>
</html>
